<button onclick="loadModel()">Load Model</button> <br /><br />
<output id="output"></output>
<script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.min.js"></script>

<script>
    const output = document.getElementById("output");

    const loadModel = async () => {
        const params = await LanguageModel.params();
        console.log("Language Model Params: ", params);

        const temperature = params.defaultTemperature || params.maxTemperature;
        const topK = params.defaultTopK || params.maxTopK;

        console.log(temperature, topK);

        const initialPrompts = [
            {
                role: "system",
                content:
                    "Você é um assistente de IA que responde de forma clara e objetiva",
            },
        ];

        const question = "Quem inventou o Javascript?";
        output.innerHTML = "Gerando resposta...";

        await new Promise((resolve) => setTimeout(resolve, 2000));

        const session = await LanguageModel.create({
            expectedInputLanguages: ["pt"],
            temperature,
            topK,
            initialPrompts,
        });

        const responseStream = await session.promptStreaming([
            {
                role: "user",
                content: question,
            },
        ]);
        output.innerHTML = "";

        let fullText = "";
        for await (const token of responseStream) {
            fullText += token;
            output.innerHTML = markdown.toHTML(fullText);
        }
    };
</script>
